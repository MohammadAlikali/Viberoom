name: VibeRoom APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36.1 Platform & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Prepare environment file
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare signing keystore
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
              echo "::error::Release build requires RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD GitHub Secrets."
              exit 1
            fi
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            test -s my-upload-key.jks
          else
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
            test -s debug.keystore
          fi

      - name: Build VibeRoom APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Package APK output
        id: package_apk
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' || echo "app")
          mkdir -p build-apk
          if [ "$BUILD_TYPE" = "release" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$SRC"
          OUT="build-apk/VibeRoom-v${VERSION_NAME}-${BUILD_TYPE}.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=VibeRoom-v${VERSION_NAME}-${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_name }}
          path: ${{ steps.package_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        run: |
          echo "### VibeRoom APK Built Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: \`${{ steps.package_apk.outputs.apk_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the APK zip from the **Artifacts** section at the bottom of this workflow run." >> "$GITHUB_STEP_SUMMARY"
